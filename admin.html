
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة منصة الاختبارات الإسلامية</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:Arial,sans-serif;background:#f5f6f8;margin:0;padding:20px;line-height:1.8}
    main{max-width:850px;margin:auto}
    section{background:white;border:1px solid #ddd;border-radius:12px;padding:20px;margin:16px 0}
    input,button{font:inherit;padding:11px;box-sizing:border-box;border-radius:7px}
    input{width:100%;border:1px solid #bbb;margin:5px 0 12px}
    button{cursor:pointer;border:0;background:#245b48;color:white;margin:5px 0}
    button:disabled{opacity:.5}
    .hidden{display:none}
    .msg{white-space:pre-wrap}
    .error{color:#a00}
    .success{color:#17632b}
    .note{color:#555;font-size:14px}
  </style>
</head>
<body>
<main>
  <h1>لوحة إدارة المنصة</h1>
  <p>الدخول المخصص للإدارة وإضافة الطلاب.</p>

  <section id="login">
    <h2>تسجيل دخول الإدارة</h2>
    <form id="loginForm">
      <label for="email">البريد الإلكتروني لحساب الإدارة</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="loginBtn">دخول</button>
    </form>
    <p id="loginMsg" class="msg" role="status"></p>
  </section>

  <section id="panel" class="hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <h2>إضافة طالب</h2>
      <button id="logoutBtn" type="button">تسجيل الخروج</button>
    </div>

    <p class="note">سيتم إرسال الطلب إلى وظيفة create-student الموجودة في Supabase. يجب أن تتحقق الوظيفة من صلاحيات الإدارة قبل إنشاء الحساب.</p>

    <form id="studentForm">
      <label for="studentName">اسم الطالب</label>
      <input id="studentName" required maxlength="150">

      <label for="studentCode">كود الطالب</label>
      <input id="studentCode" required maxlength="50">

      <label for="studentPassword">كلمة المرور الأولية</label>
      <input id="studentPassword" type="password" required minlength="8" autocomplete="new-password">

      <label for="courseId">رقم المساق (اختياري إذا كانت الوظيفة تدعم ذلك)</label>
      <input id="courseId" type="number" min="1">

      <button id="createBtn" type="submit">إضافة الطالب</button>
    </form>
    <p id="createMsg" class="msg" role="status"></p>
  </section>
</main>

<script>
(() => {
  'use strict';

  const SUPABASE_URL = 'https://pxgxnwxpwvvefroaqpfr.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_Y1VPWMTp80Sn-yIlAKAPCA_27GhFxtP';

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const $ = id => document.getElementById(id);
  const show = (id, visible) => $(id).classList.toggle('hidden', !visible);
  const say = (id, text, kind = '') => {
    $(id).className = 'msg ' + kind;
    $(id).textContent = text;
  };

  $('loginForm').addEventListener('submit', async event => {
    event.preventDefault();
    $('loginBtn').disabled = true;
    say('loginMsg', 'جارٍ تسجيل الدخول...');

    try {
      const { error } = await db.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('password').value
      });

      if (error) throw error;

      show('login', false);
      show('panel', true);
      say('loginMsg', '');
    } catch (error) {
      say('loginMsg', 'تعذر تسجيل الدخول: ' + error.message, 'error');
    } finally {
      $('loginBtn').disabled = false;
    }
  });

  $('studentForm').addEventListener('submit', async event => {
    event.preventDefault();

    const { data: sessionData } = await db.auth.getSession();
    if (!sessionData.session) {
      show('login', true);
      show('panel', false);
      say('createMsg', 'انتهت الجلسة. سجلي الدخول مجددًا.', 'error');
      return;
    }

    const courseText = $('courseId').value.trim();
    const payload = {
      name: $('studentName').value.trim(),
      code: $('studentCode').value.trim(),
      password: $('studentPassword').value,
      course_id: courseText ? Number(courseText) : null
    };

    $('createBtn').disabled = true;
    say('createMsg', 'جارٍ إرسال طلب إنشاء الطالب...');

    try {
      const { data, error } = await db.functions.invoke('create-student', {
        body: payload
      });

      if (error) throw error;
      if (data && data.error) throw new Error(data.error);

      say(
        'createMsg',
        'استجابت الوظيفة للطلب. راجعي تفاصيل النتيجة للتأكد من إنشاء الحساب وربطه بالمساق.',
        'success'
      );
      $('studentForm').reset();
    } catch (error) {
      say(
        'createMsg',
        'لم يكتمل الطلب. قد تحتاج الوظيفة إلى حقول مختلفة أو إعداد صلاحيات الإدارة.\n' +
        (error.message || String(error)),
        'error'
      );
    } finally {
      $('createBtn').disabled = false;
    }
  });

  $('logoutBtn').addEventListener('click', async () => {
    await db.auth.signOut();
    show('panel', false);
    show('login', true);
    $('studentForm').reset();
    say('loginMsg', 'تم تسجيل الخروج.');
  });

  (async () => {
    const { data } = await db.auth.getSession();
    if (data.session) {
      show('login', false);
      show('panel', true);
    }
  })();
})();
</script>
</body>
</html>
